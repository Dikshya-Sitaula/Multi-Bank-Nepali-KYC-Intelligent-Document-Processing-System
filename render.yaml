services:
  - type: web
    name: kyc-vision-api
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt && pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: kyc-vision-db
          property: connectionString
      - key: CORS_ORIGINS
        value: https://kyc-vision-frontend.onrender.com
      - key: OCR_PRELOAD
        value: "false"
      - key: WORKER_ENABLED
        value: "true"
      - key: BOOTSTRAP_ADMIN_USERNAME
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false

  - type: web
    name: kyc-vision-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE
        value: https://kyc-vision-api.onrender.com/api/v1

databases:
  - name: kyc-vision-db
    plan: free
    databaseName: kyc_vision
    user: kyc_vision
